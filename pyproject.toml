[tool.poetry]
name = "offline-doc-intelligence"
version = "0.1.0"
description = "Offline semantic document search and extractive QA engine"
authors = ["Project Team"]
license = "Proprietary"
python = ">=3.10"

[tool.poetry.dependencies]
# PDF parsing — MIT / BSD only (no MuPDF, no PyMuPDF)
pdfplumber = ">=0.11"
pdfminer-six = ">=20221105"
pypdf = ">=4.0"
Pillow = ">=10.0"

# OCR — Apache 2.0
pytesseract = ">=0.3"

# BM25 — Apache 2.0
rank-bm25 = ">=0.2"

# HNSW vector index — Apache 2.0
hnswlib = ">=0.7"

# ONNX Runtime — MIT
onnxruntime = ">=1.17"

# NLP / tokenization — Apache 2.0 / MIT
tokenizers = ">=0.19"
spacy = ">=3.7"

# Numerical / scientific — BSD
numpy = ">=1.26"
scipy = ">=1.12"

# Schema validation
jsonschema = ">=4.21"

# Serialization / storage
msgpack = ">=1.0"
tqdm = ">=4.66"

# CLI
click = ">=8.1"
rich = ">=13.0"

# Configuration
python-dotenv = ">=1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
pytest-benchmark = ">=4.0"
mypy = ">=1.9"
ruff = ">=0.4"

[tool.poetry.scripts]
odi-cli = "cli.cli:main"
odi-bench = "benchmarks.harness:main"
odi-setup = "scripts.setup:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["core", "cli", "benchmarks"]
omit = ["tests/*", "scripts/*"]
